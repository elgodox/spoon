appId: com.spoon.git
productName: Spoon
copyright: Copyright © 2026 Alan (elgodox)
directories:
  output: dist
  buildResources: resources
files:
  - out/**/*
asar: true
compression: maximum
electronLanguages:
  - en-US
  - es
removePackageScripts: true
publish:
  provider: github
  owner: elgodox
  repo: spoon
  releaseType: release
win:
  icon: resources/icon.ico
  executableName: Spoon
  requestedExecutionLevel: asInvoker
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Spoon-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Spoon
  uninstallDisplayName: Spoon
  runAfterFinish: true
  packElevateHelper: false
  differentialPackage: false
  deleteAppDataOnUninstall: false
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico
  installerSidebar: resources/installerSidebar.bmp
  installerHeader: resources/installerHeader.bmp
extraResources:
  - from: resources/icon.png
    to: icon.png
extraMetadata:
  main: out/main/index.js
