<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <!-- A spoon drawn as a commit graph: the bowl is HEAD, the handle is the main line
       ending in the root commit, and a branch forks off toward its own commit. -->
  <g transform="translate(512 512) scale(1.08) translate(-522 -496) rotate(-45 512 512)" fill="none" stroke-linecap="round">
    <path d="M512 560 C512 660 660 640 660 712" stroke="#7dd3fc" stroke-width="44"/>
    <circle cx="660" cy="760" r="40.5" stroke="#7dd3fc" stroke-width="31"/>
    <ellipse cx="512" cy="288" rx="138" ry="176" fill="#FFFFFF"/>
    <path d="M512 440 V770" stroke="#FFFFFF" stroke-width="52"/>
    <circle cx="512" cy="826" r="47" stroke="#FFFFFF" stroke-width="34"/>
  </g>
</svg>
